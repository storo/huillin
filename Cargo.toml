[package]
name = "huillin"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
rand = "0.10"
hex = "0.4"
num-bigint = "0.5"
tao = "0.37.1"
wry = "0.57.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.26.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

