name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Versión
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: cargo build --release --locked

      - name: Instalador
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\huillin.iss

      - name: Zip portable
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\release\huillin.exe, LICENSE, README.md dist\portable\
          Compress-Archive -Path dist\portable\* -DestinationPath "dist\Huillin-$v-portable.zip"
          Remove-Item -Recurse dist\portable

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar
        run: |
          v="${{ steps.ver.outputs.version }}"
          d="Huillin-$v-linux-x86_64"
          mkdir -p "dist" "$d"
          cp target/release/huillin LICENSE README.md "$d/"
          cp ui/logo.png "$d/huillin.png"
          cat > "$d/huillin.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Huillín
          Comment=Cliente BitTorrent
          Exec=huillin %U
          Icon=huillin
          Terminal=false
          Categories=Network;FileTransfer;P2P;
          MimeType=application/x-bittorrent;x-scheme-handler/magnet;
          EOF
          tar -czf "dist/$d.tar.gz" "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-latest
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compilar
        run: cargo build --release --locked

      - name: Crear Huillin.app
        run: |
          v="${{ steps.ver.outputs.version }}"
          app="dist/Huillin.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist/icon.iconset
          cp target/release/huillin "$app/Contents/MacOS/huillin"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s ui/logo.png --out "dist/icon.iconset/icon_${s}x${s}.png" >/dev/null
          done
          iconutil -c icns dist/icon.iconset -o "$app/Contents/Resources/huillin.icns"
          rm -rf dist/icon.iconset
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Huillín</string>
            <key>CFBundleDisplayName</key><string>Huillín</string>
            <key>CFBundleIdentifier</key><string>io.github.storo.huillin</string>
            <key>CFBundleExecutable</key><string>huillin</string>
            <key>CFBundleIconFile</key><string>huillin</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>$v</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array><dict>
              <key>CFBundleTypeName</key><string>Archivo torrent</string>
              <key>CFBundleTypeRole</key><string>Viewer</string>
              <key>LSItemContentTypes</key><array><string>org.bittorrent.torrent</string></array>
              <key>CFBundleTypeExtensions</key><array><string>torrent</string></array>
            </dict></array>
            <key>CFBundleURLTypes</key>
            <array><dict>
              <key>CFBundleURLName</key><string>Magnet</string>
              <key>CFBundleURLSchemes</key><array><string>magnet</string></array>
            </dict></array>
          </dict>
          </plist>
          EOF
          # Firma ad-hoc para que Gatekeeper no la declare «dañada» en Apple Silicon.
          codesign --force --deep --sign - "$app"
          cd dist && ditto -c -k --keepParent Huillin.app "Huillin-$v-macos-${{ matrix.arch }}.zip" && rm -rf Huillin.app

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
