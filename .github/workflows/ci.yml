name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-platforms:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  check:
    needs: check-platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar todas las plataformas
        env:
          RESULT: ${{ needs.check-platforms.result }}
        run: test "$RESULT" = "success"
