name: Reportar un error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: ¿Qué ocurre?
      description: Describe el problema y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Huillín
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Huillín
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 23H2"
  - type: dropdown
    id: install
    attributes:
      label: Tipo de instalación
      options: [Instalador, Portable, Compilado desde el código]
  - type: textarea
    id: extra
    attributes:
      label: Información adicional
      description: Capturas, mensajes de error, etc. No incluyas enlaces magnet de contenido protegido.
